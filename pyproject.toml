[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bestquark-paintings"
version = "0.1.0"
description = "Seven streams of existing art for desktops, terminals, and the web"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "bestquark"}]
dependencies = []

[project.scripts]
paintings = "paintings.cli:main"

[tool.setuptools]
packages = ["paintings"]

[tool.setuptools.data-files]
"share/paintings/catalog" = ["catalog/*.json"]
"share/paintings/config" = ["config/*.json"]
"share/paintings/adapters" = ["adapters/*.swift", "adapters/*.json", "adapters/*LICENSE"]
"share/paintings/web" = ["web/*.js", "web/*.css", "web/*.html"]
